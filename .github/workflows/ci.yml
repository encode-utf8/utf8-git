name: CI

on:
  push:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint / Typecheck / Test / Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 门禁等级（high）与容忍清单（见 pnpm-workspace.yaml 的 audit 段注释）
      # 由 pnpm-workspace.yaml 统一配置；仓库 .npmrc 指向国内镜像、其审计
      # 端点不可用，故显式走 npmjs 的 advisory 接口。
      - name: Security audit (pnpm audit)
        run: pnpm audit --registry=https://registry.npmjs.org

      # 格式化门禁：统一口径 prettier --check .（忽略清单见 .prettierignore），
      # 存量漂移已于 M4-8 清零，此后任何未格式化提交在此拦下。
      - name: Format (prettier --check)
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (unit + coverage)
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

  e2e:
    name: E2E (Playwright + Postgres)
    runs-on: ubuntu-latest
    needs: verify
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: utf8git
          POSTGRES_PASSWORD: utf8git_dev
          POSTGRES_DB: utf8git_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter @utf8-git/web exec playwright install --with-deps chromium

      - name: Run E2E
        run: pnpm test:e2e
        env:
          E2E_DATABASE_URL: postgresql://utf8git:utf8git_dev@localhost:5432/utf8git_e2e?schema=public

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
