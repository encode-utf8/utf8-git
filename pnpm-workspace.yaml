packages:
  - "apps/*"
  - "packages/*"

# 明确不执行构建脚本的依赖（由 create-next-app 生成，pnpm 构建脚本审批机制）
allowBuilds:
  sharp: false
  unrs-resolver: false
  "@prisma/client": true
  "@prisma/engines": true
  prisma: true

# prisma 6.x 全系（含最新 6.19.3）固定 deepmerge-ts@7.1.5，而 8.x 已修复
# GHSA-ggr8-5vv4-36mx（合并递归对象图时栈耗尽）。@prisma/config 只用到
# deepmerge 基础导出、v8 未改其签名，故整体强制升级；版本不兼容会被
# apps/web 的 postinstall: prisma generate 立刻暴露。
overrides:
  deepmerge-ts: ^8.0.2

audit:
  # CI 门禁：high 及以上即失败
  level: high
  # GHSA-vfj7-8cjw-p6xm（braces 栈耗尽）：上游 micromatch 依赖的 braces
  # <=3.0.3 无补丁版本（npm 最新即 3.0.3），且路径仅存在于 eslint
  # 开发链（eslint-config-next -> fast-glob -> micromatch），不进生产
  # 运行时。显式登记容忍项，避免为了静默它而把门禁降到 critical。
  # 上游修复后（braces 发布新版本）可直接删除本条。
  ignore:
    - GHSA-vfj7-8cjw-p6xm
